<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <!--
    Public enquiry form. A business puts this page (or the form) on its website.
    When a customer sends it, the backend creates a "Website" lead automatically.
    The page also measures how long the customer spent here and how many times
    they visited, so the ML model gets real "time on website" and "visits".
  -->
  <style>
    :root { --navy: #13315c; --border: #cbd5e1; --text: #1e293b; --muted: #64748b; --error: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f1f5f9; color: var(--text); }
    .card { max-width: 560px; margin: 48px auto; background: #fff; border-radius: 12px; padding: 32px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08); }
    h1 { margin: 0 0 6px; color: var(--navy); font-size: 26px; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    label { display: block; font-weight: bold; font-size: 14px; margin: 16px 0 6px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
                      font-size: 15px; font-family: inherit; }
    input.bad, textarea.bad { border-color: var(--error); background: #fef2f2; }
    .err { color: var(--error); font-size: 13px; margin-top: 4px; min-height: 16px; }
    button { margin-top: 24px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--navy);
             color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .done { text-align: center; padding: 24px 0; }
    .done h2 { color: #166534; }
    @media (max-width: 600px) { .card { margin: 16px; padding: 22px; } }
  </style>
</head>
<body>
  <div class="card">
    <div id="formBox">
      <h1>Get in touch</h1>
      <p class="lead">Tell us what you're looking for and we'll get back to you.</p>
      <form id="enquiry" novalidate>
        <label for="name">Your name *</label>
        <input id="name" name="name" autocomplete="name" />
        <div class="err" id="name-err"></div>

        <label for="phone">Phone number *</label>
        <input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="9876543210" />
        <div class="err" id="phone-err"></div>

        <label for="email">Email</label>
        <input id="email" name="email" autocomplete="email" />
        <div class="err" id="email-err"></div>

        <label for="interested_in">What are you interested in?</label>
        <input id="interested_in" name="interested_in" placeholder="e.g. Website Design" />
        <div class="err" id="interested_in-err"></div>

        <label for="message">Your message</label>
        <textarea id="message" name="message" rows="4" placeholder="Ask us anything: price, details, a call..."></textarea>
        <div class="err" id="message-err"></div>

        <button type="submit" id="send">Send enquiry</button>
        <div class="err" id="form-err"></div>
      </form>
    </div>
    <div id="thanks" class="done" hidden>
      <h2>Thank you!</h2>
      <p id="thanksText">Our team will contact you soon.</p>
    </div>
  </div>

  <script>
    // ---- Measure time on this page and count visits (stored only in this browser) ----
    const startedAt = Date.now();
    let visits = 1, earlierSeconds = 0;
    try {
      visits = Number(localStorage.getItem("enquiry_visits") || 0) + 1;
      earlierSeconds = Number(localStorage.getItem("enquiry_seconds") || 0);
      localStorage.setItem("enquiry_visits", visits);
    } catch (e) { /* private mode: just use this visit */ }
    window.addEventListener("pagehide", () => {
      try { localStorage.setItem("enquiry_seconds", earlierSeconds + (Date.now() - startedAt) / 1000); } catch (e) {}
    });

    // ---- Same validation rules as the backend ----
    const rules = {
      name: (v) => v.trim().length >= 2 || "Please enter your name",
      phone: (v) => /^\+?[0-9]{10,13}$/.test(v.trim()) || "Enter 10-13 digits, e.g. 9876543210",
      email: (v) => !v || /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v.trim()) || "Enter a valid email",
      interested_in: (v) => v.length <= 80 || "Please keep this under 80 characters",
      message: (v) => v.length <= 1000 || "Please keep the message under 1000 characters",
    };

    const form = document.getElementById("enquiry");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      let valid = true;
      for (const [field, check] of Object.entries(rules)) {
        const input = document.getElementById(field);
        const result = check(input.value);
        const message = result === true ? "" : result;
        document.getElementById(field + "-err").textContent = message;
        input.classList.toggle("bad", Boolean(message));
        if (message) valid = false;
      }
      if (!valid) return;

      const value = (id) => document.getElementById(id).value.trim() || null;
      const button = document.getElementById("send");
      button.disabled = true;
      button.textContent = "Sending...";
      try {
        const response = await fetch("/public/enquiry", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: value("name"), phone: value("phone"), email: value("email"),
            interested_in: value("interested_in"), message: value("message"),
            seconds_on_page: earlierSeconds + (Date.now() - startedAt) / 1000,
            visits: visits,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error("Please check your details and try again.");
        document.getElementById("thanksText").textContent = data.message;
        document.getElementById("formBox").hidden = true;
        document.getElementById("thanks").hidden = false;
      } catch (err) {
        document.getElementById("form-err").textContent = err.message || "Could not send. Please try again.";
        button.disabled = false;
        button.textContent = "Send enquiry";
      }
    });
  </script>
</body>
</html>
