<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get in touch</title>
  <!--
    Public enquiry form. A business links to this page (or embeds it with the iframe code
    from the Connect page). When a customer sends it, the backend creates a "Website" lead.
    The page also measures time on the page and visits, so the ML model gets real values.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --forest: #1F3D2B; --forest-700: #142A1D; --high: #33733D; --high-50: #E5EFE1; --danger-ink: #B42318;
            --danger-50: #FDECEC; --danger-line: #F3C4C0; --terra-600: #B84A33; --bg: #F5F3EE; --line: #E3DED4;
            --input: #D5CFC3; --ink: #1B211C; --ink-2: #3B413C; --muted: #5E645D; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Anek Latin', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 26px; font-weight: 700; line-height: 1.25; letter-spacing: -0.015em; }
    [hidden] { display: none !important; }
    .public-body { min-height: 100vh; padding: 56px 16px; }
    .card { max-width: 480px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 16px; background: #fff;
            border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px rgba(27,33,28,.06); }
    .muted { color: var(--muted); } .small { font-size: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > span:first-child { font-weight: 500; }
    .req { color: var(--danger-ink); }
    .input, .textarea { font: inherit; font-size: 15px; color: var(--ink); width: 100%; background: #fff; border: 1px solid var(--input);
                        border-radius: 8px; padding: 0 12px; min-height: 44px; transition: border-color .15s, box-shadow .15s; }
    .textarea { padding: 10px 12px; resize: vertical; line-height: 1.55; }
    .input:focus, .textarea:focus { outline: none; border-color: var(--terra-600); box-shadow: 0 0 0 3px rgba(184,74,51,.18); }
    .is-invalid .input, .is-invalid .textarea { border: 1.5px solid var(--danger-ink); }
    .error-text { color: var(--danger-ink); font-size: 13px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 15px; font-weight: 600;
           min-height: 48px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
    .btn-brand { background: var(--forest); color: #fff; width: 100%; } .btn-brand:hover { background: var(--forest-700); }
    .btn-outline { background: #fff; color: var(--forest); border-color: var(--input); min-height: 44px; }
    .btn:disabled { opacity: .7; cursor: wait; }
    .alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 10px 12px; font-size: 14px;
             background: var(--danger-50); color: #7A1A12; border: 1px solid var(--danger-line); }
    .thanks { align-items: center; text-align: center; padding: 48px 32px; }
    .check { width: 56px; height: 56px; border-radius: 999px; background: var(--high-50); color: var(--high); display: grid; place-items: center; }
    :focus-visible { outline: 2px solid var(--terra-600); outline-offset: 2px; }
    @media (max-width: 760px) { .card { padding: 22px; } .public-body { padding: 24px 16px; } }
  </style>
</head>
<body>
  <main class="public-body">
    <form class="card" id="enquiry" novalidate>
      <div>
        <h1>Get in touch</h1>
        <p class="muted" id="intro" style="margin-top:4px">Tell us what you're looking for and we'll get back to you.</p>
      </div>
      <label class="field" id="f-name"><span>Your name <span class="req">*</span></span>
        <input class="input" id="name" autocomplete="name" /><span class="error-text" hidden></span></label>
      <label class="field" id="f-phone"><span>Phone <span class="req">*</span></span>
        <input class="input" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="9876543210" /><span class="error-text" hidden></span></label>
      <label class="field" id="f-email"><span>Email</span>
        <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" /><span class="error-text" hidden></span></label>
      <label class="field" id="f-interested_in"><span>What are you interested in?</span>
        <input class="input" id="interested_in" placeholder="e.g. Maruti Swift VXI" /><span class="error-text" hidden></span></label>
      <label class="field" id="f-message"><span>Your message</span>
        <textarea class="textarea" id="message" rows="4" placeholder="Ask about price, availability, delivery…"></textarea><span class="error-text" hidden></span></label>
      <div class="alert" id="form-err" role="alert" hidden></div>
      <button type="submit" class="btn btn-brand" id="send">Send enquiry</button>
      <p class="small muted" style="text-align:center">We only use your details to reply to this enquiry.</p>
    </form>

    <div class="card thanks" id="thanks" hidden role="status">
      <span class="check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <h2 id="thanksTitle" tabindex="-1" style="font-size:23px">Thank you!</h2>
      <p id="thanksText" style="font-size:16px;color:var(--ink-2)">Our team will contact you soon.</p>
      <button type="button" class="btn btn-outline" id="again">Send another enquiry</button>
    </div>
  </main>

  <script>
    // ---- Measure time on this page and count visits (stored only in this browser) ----
    const startedAt = Date.now();
    let visits = 1, earlierSeconds = 0;
    try {
      visits = Number(localStorage.getItem("enquiry_visits") || 0) + 1;
      earlierSeconds = Number(localStorage.getItem("enquiry_seconds") || 0);
      localStorage.setItem("enquiry_visits", visits);
    } catch (e) { /* private mode: just use this visit */ }
    window.addEventListener("pagehide", () => {
      try { localStorage.setItem("enquiry_seconds", earlierSeconds + (Date.now() - startedAt) / 1000); } catch (e) {}
    });

    // Use the business name from My Business in the heading
    fetch("/business").then((r) => r.json()).then((b) => {
      if (!b.name) return;
      document.title = "Get in touch – " + b.name;
      document.getElementById("intro").textContent = "Tell " + b.name + " what you're looking for. We usually reply within a few hours.";
    }).catch(() => {});

    // ---- Same validation rules as the backend ----
    const rules = {
      name: (v) => v.trim().length >= 2 || "Please tell us your name.",
      phone: (v) => /^\+?[0-9]{10,13}$/.test(v.trim().replace(/\s/g, "")) || "Enter a 10-digit phone number so we can reach you.",
      email: (v) => !v || /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v.trim()) || "This email doesn't look right.",
      interested_in: (v) => v.length <= 80 || "Please keep this under 80 characters.",
      message: (v) => v.length <= 1000 || "Please keep the message under 1000 characters.",
    };

    const form = document.getElementById("enquiry");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      let first = null;
      for (const [field, check] of Object.entries(rules)) {
        const input = document.getElementById(field), wrap = document.getElementById("f-" + field);
        const result = check(input.value), message = result === true ? "" : result;
        const err = wrap.querySelector(".error-text");
        err.textContent = message; err.hidden = !message;
        wrap.classList.toggle("is-invalid", Boolean(message));
        input.setAttribute("aria-invalid", String(Boolean(message)));
        if (message && !first) first = input;
      }
      if (first) { first.focus(); return; }

      const value = (id) => document.getElementById(id).value.trim() || null;
      const button = document.getElementById("send"), formErr = document.getElementById("form-err");
      button.disabled = true; button.textContent = "Sending…"; formErr.hidden = true;
      try {
        const response = await fetch("/public/enquiry", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: value("name"), phone: (value("phone") || "").replace(/\s/g, ""), email: value("email"),
            interested_in: value("interested_in"), message: value("message"),
            seconds_on_page: earlierSeconds + (Date.now() - startedAt) / 1000, visits: visits,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error("Please check your details and try again.");
        document.getElementById("thanksTitle").textContent = "Thank you " + value("name").split(" ")[0] + "!";
        document.getElementById("thanksText").textContent = "Our team will contact you soon.";
        form.hidden = true; document.getElementById("thanks").hidden = false;
        document.getElementById("thanksTitle").focus();
      } catch (err) {
        formErr.textContent = err.message === "Failed to fetch" ? "We couldn't send your enquiry. Check your connection and try again." : err.message;
        formErr.hidden = false;
      } finally {
        button.disabled = false; button.textContent = "Send enquiry";
      }
    });
    document.getElementById("again").onclick = () => {
      form.reset(); form.hidden = false; document.getElementById("thanks").hidden = true; document.getElementById("name").focus();
    };
  </script>
</body>
</html>
