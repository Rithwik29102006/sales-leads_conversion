# Render Blueprint: Render → New → Blueprint → pick this repository.
# Free plan has no disk, so the data lives in Supabase Postgres (DATABASE_URL): leads, the
# business profile and the retrained models all survive deploys and restarts.
services:
  - type: web
    name: lead-conversion
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /options
    envVars:                    # sync: false = Render asks for the value when the Blueprint is created
      - key: DATABASE_URL       # Supabase → Connect → Session pooler (Render cannot reach the IPv6-only direct one)
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: EMAIL_WEBHOOK_TOKEN
        sync: false
