# Render Blueprint: Render → New → Blueprint → pick this repository.
# Free plan: no disk, so leads.db and retrained models are lost on every deploy or restart,
# and the service sleeps after 15 minutes without requests.
# For data that survives: change plan to "starter" and add
#     disk: { name: data, mountPath: /data, sizeGB: 1 }
services:
  - type: web
    name: lead-conversion
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /options
    envVars:                    # sync: false = Render asks for the value when the Blueprint is created
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: EMAIL_WEBHOOK_TOKEN
        sync: false
